spring.datasource.url=jdbc:mysql://localhost:3306/rmage_test_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=rmage_test_user
spring.datasource.password=test_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OAuth2 Resource Server Configuration (Keycloak JWT Validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/rmage-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/rmage-realm/protocol/openid-connect/certs

# Keycloak Configuration
keycloak.auth-server-url=http://localhost:9090
keycloak.realm=rmage-realm
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.client-id=admin-cli

# S3 Configuration (MinIO)
s3.endpoint=http://localhost:9000
s3.access-key=rmageAppAccessKey
s3.secret-key=1234
s3.bucket-name=rmage-documents-test

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.rmage=DEBUG
logging.level.org.keycloak=DEBUG
